# .claude/.claude/catalog.yaml
# Catalog of Lazarus sub-agents for Claude Code
# Each entry maps a name to its agent definition file inside /agents

version: 1
project: Lazarus
description: Central index of all Lazarus sub-agents. Enables Claude Code to discover, chain, and delegate tasks consistently.

agents:
  - name: review-verifier
    file: agents/review-verifier.md
    goal: Enforce the Solution Verification Checklist with explicit Pass/Fail evidence.

  - name: skeptic-challenger
    file: agents/skeptic-challenger.md
    goal: Push back on every plan; propose simpler/safer alternatives.

  - name: comments-scribe
    file: agents/comments-scribe.md
    goal: Add XML documentation and inline code comments.

  - name: repo-surgeon
    file: agents/repo-surgeon.md
    goal: Perform structural refactors (projects, namespaces, csproj, sln).

  - name: wpf-stylist
    file: agents/wpf-stylist.md
    goal: Fix and polish XAML styles, themes, and control templates.

  - name: asset-keeper
    file: agents/asset-keeper.md
    goal: Manage model assets (VAEs, LoRAs, ControlNets, embeddings).

  - name: rag-mason
    file: agents/rag-mason.md
    goal: Build and maintain retrieval-augmented generation pipelines.

  - name: eval-judge
    file: agents/eval-judge.md
    goal: Score outputs for correctness, completeness, safety, and standards.

  - name: perf-tuner
    file: agents/perf-tuner.md
    goal: Optimize inference and pipeline performance safely.

  - name: safety-warden
    file: agents/safety-warden.md
    goal: Enforce security and safety guardrails.

  - name: crash-handler
    file: agents/crash-handler.md
    goal: Diagnose crashes, reproduce bugs, and propose safe fixes.

  - name: dx-scaffolder
    file: agents/dx-scaffolder.md
    goal: Generate scaffolding and boilerplate that matches Lazarus conventions.

  - name: release-falconer
    file: agents/release-falconer.md
    goal: Package, sign, and publish Lazarus releases with changelogs.

  - name: docs-scribe
    file: agents/docs-scribe.md
    goal: Write project-level docs, architecture guides, and changelogs.

  - name: ui-curator
    file: agents/ui-curator.md
    goal: Polish UI/UX copy, layouts, and accessibility.

  - name: telemetry-curator
    file: agents/telemetry-curator.md
    goal: Design and validate metrics, logs, and observability.

  - name: migration-sentinel
    file: agents/migration-sentinel.md
    goal: Oversee safe upgrades, dependency bumps, and schema changes.

  - name: test-carpenter
    file: agents/test-carpenter.md
    goal: Build and maintain automated test coverage including edge cases.

  - name: prompt-caretaker
    file: agents/prompt-caretaker.md
    goal: Maintain and refine prompt templates; ensure clarity and injection safety.

  - name: lora-alchemist
    file: agents/lora-alchemist.md
    goal: Train, validate, and manage LoRA adapters safely.

  - name: runner-whisperer
    file: agents/runner-whisperer.md
    goal: Manage runner processes, monitor health, and recover from crashes.
